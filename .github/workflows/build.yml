name: Build GCalc

# Runs on every push to main, or by hand from the Actions tab.
on:
  push:
    branches: [main]
    # Test tooling and docs don't change the app; skip a rebuild for them.
    paths-ignore:
      - "tests/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    # Ubuntu 24.04 images ship with the Android SDK preinstalled.
    runs-on: ubuntu-24.04
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      # Optional: a fixed signing key so new versions install over old ones.
      # Add repository secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD to enable.
      - name: Restore signing key
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/gcalc.jks"
          echo "GCALC_KEYSTORE_PATH=$RUNNER_TEMP/gcalc.jks" >> "$GITHUB_ENV"

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Build APKs
        working-directory: android
        env:
          GCALC_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          GCALC_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          GCALC_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GCALC_VERSION_CODE: ${{ github.run_number }}
          GCALC_VERSION_NAME: 1.0.${{ github.run_number }}
        run: ./gradlew --no-daemon assembleRelease assembleDebug

      - name: Collect APKs
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk GCalc.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk GCalc-debug.apk
          ls -la GCalc*.apk

      - uses: actions/upload-artifact@v7
        with:
          name: GCalc-apk
          path: GCalc.apk

      - uses: actions/upload-artifact@v7
        with:
          name: GCalc-debug-apk
          path: GCalc-debug.apk

  android-test:
    name: Android OCR test (emulator)
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: GCalc-debug-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run self-test in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash android/selftest.sh GCalc-debug.apk

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-screen
          path: android-screen.png
          if-no-files-found: ignore

  release:
    name: Publish APK
    needs: [android, android-test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: GCalc-apk

      # Publishes the APK on the repo's Releases page so it can be downloaded straight from a phone.
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: GCalc 1.0.${{ github.run_number }}
          make_latest: true
          files: GCalc.apk
          body: |
            Download **GCalc.apk** below on your Android phone and open it to install.
            iPhone: open the web app link from the README in Safari, then Share > Add to Home Screen.

  web:
    name: Web app (GitHub Pages, for iPhone)
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v5
