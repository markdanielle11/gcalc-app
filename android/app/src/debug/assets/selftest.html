<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GCalc self-test</title>
</head>
<body>
<p id="out">Running</p>
<!-- Debug builds only: CI opens this page in an emulator to check that the
     offline text reader works inside the Android app. -->
<script src="ocr.js"></script>
<script>
(function () {
	var rows = [
		["1", "INTECH 3100", "3", "1.25", "PASSED"],
		["2", "STAT 3206", "3", "NOT YET", "NOT YET"],
		["3", "PHILI 1100", "3", "1.00", "PASSED"],
		["4", "GEC 104", "2", "2.75", "PASSED"]
	];
	var expected = [["INTECH 3100", 3, 1.25], ["STAT 3206", 3, 0], ["PHILI 1100", 3, 1], ["GEC 104", 2, 2.75]];
	var cols = [20, 110, 420, 540, 700, 880];
	var c = document.createElement("canvas");
	c.width = 900; c.height = 60 + rows.length * 60;
	var g = c.getContext("2d");
	g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
	g.fillStyle = "#333"; g.strokeStyle = "#333"; g.lineWidth = 2;
	g.font = "bold 20px sans-serif";
	["No.", "SUBJECTS", "UNITS", "GRADE", "REMARKS"].forEach(function (h, i) { g.fillText(h, cols[i] + 10, 38); });
	g.font = "22px sans-serif";
	rows.forEach(function (r, ri) {
		var y = 60 + ri * 60;
		r.forEach(function (t, i) { g.fillText(t, cols[i] + 10, y + 38); });
		g.beginPath(); g.moveTo(cols[0], y); g.lineTo(cols[5], y); g.stroke();
	});
	cols.forEach(function (x) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, c.height); g.stroke(); });

	function done(msg) {
		document.getElementById("out").textContent = msg;
		console.log(msg);
	}
	c.toBlob(function (blob) {
		var t0 = Date.now();
		window.GCalcOCR.read(blob, function () {}).then(function (res) {
			var got = res.rows.map(function (r) { return [r.name, r.units, r.grades]; });
			var ok = JSON.stringify(got) === JSON.stringify(expected);
			done("GCALC_SELFTEST " + (ok ? "PASS" : "FAIL") + " " + (Date.now() - t0) + "ms " + JSON.stringify(got));
		}).catch(function (e) {
			done("GCALC_SELFTEST FAIL error " + (e && (e.message || e)));
		});
	}, "image/png");
})();
</script>
</body>
</html>
