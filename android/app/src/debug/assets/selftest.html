<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GCalc self-test</title>
</head>
<body>
<pre id="out">Running</pre>
<script>window.GCALC_DEBUG = true;</script>
<!-- Debug builds only: CI opens this page in an emulator to check that the
     offline text reader works inside the Android app. -->
<script src="ocr.js"></script>
<script>
(function () {
	// Narrow subject column like the portal on a phone: codes wrap onto two lines.
	var rows = [
		["1", ["INTECH", "3100"], "3", "1.25", "PASSED"],
		["2", ["STAT", "3206"], "3", ["NOT YET", "SUBMITTED"], "NOT YET"],
		["3", ["PHILI", "1100"], "3", "1.00", "PASSED"],
		["4", ["GEC", "104"], "2", "2.75", "PASSED"],
		["5", ["COMSCI", "3100"], "3", "1.50", "PASSED"]
	];
	var expected = [["INTECH 3100", 3, 1.25], ["STAT 3206", 3, 0], ["PHILI 1100", 3, 1], ["GEC 104", 2, 2.75], ["COMSCI 3100", 3, 1.5]];
	var cols = [10, 70, 200, 280, 420, 560];
	var rowH = 90;
	var c = document.createElement("canvas");
	c.width = 570; c.height = 60 + rows.length * rowH + 2;
	var g = c.getContext("2d");
	g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
	g.fillStyle = "#333"; g.strokeStyle = "#333"; g.lineWidth = 2;
	g.font = "bold 18px sans-serif";
	["No.", "SUBJECTS", "UNITS", "GRADE", "REMARKS"].forEach(function (h, i) { g.fillText(h, cols[i] + 6, 38); });
	g.font = "22px sans-serif";
	function line(x0, y0, x1, y1) { g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke(); }
	line(cols[0], 0, cols[5], 0);
	rows.forEach(function (r, ri) {
		var y = 60 + ri * rowH;
		line(cols[0], y, cols[5], y);
		r.forEach(function (t, i) {
			if (Array.isArray(t)) {
				g.fillText(t[0], cols[i] + 6, y + 36);
				g.fillText(t[1], cols[i] + 6, y + 72);
			} else {
				g.fillText(t, cols[i] + 6, y + 54);
			}
		});
	});
	line(cols[0], c.height - 1, cols[5], c.height - 1);
	cols.forEach(function (x) { line(x, 0, x, c.height); });

	function done(msg) {
		var out = document.getElementById("out");
		out.textContent += "\n" + msg;
		console.log(msg);
	}
	function blobOf(canvas, scale) {
		return new Promise(function (resolve) {
			var t = canvas;
			if (scale !== 1) {
				t = document.createElement("canvas");
				t.width = Math.round(canvas.width * scale);
				t.height = Math.round(canvas.height * scale);
				var x = t.getContext("2d");
				x.imageSmoothingQuality = "high";
				x.drawImage(canvas, 0, 0, t.width, t.height);
			}
			t.toBlob(resolve, "image/png");
		});
	}
	async function run(label, scale, forceTesseract) {
		window.GCALC_FORCE_TESSERACT = forceTesseract;
		var t0 = Date.now();
		try {
			var res = await window.GCalcOCR.read(await blobOf(c, scale), function () {});
			var got = res.rows.map(function (r) { return [r.name, r.units, r.grades]; });
			var ok = JSON.stringify(got) === JSON.stringify(expected);
			// Inside the Android app the AI cases must really use the on-device AI reader.
			if (!forceTesseract && window.GCalcAndroid && res.mode !== "ai") ok = false;
			if (!ok && res.layout) {
				done("GCALC_CASE " + label + "-lines " + JSON.stringify(res.layout.lines.map(function (l) {
					return [l.text, l.box].concat(l.elements.length > 1 ? [l.elements.map(function (e) { return e.text + "@" + e.box.join(","); })] : []);
				})).slice(0, 3000));
			}
			done("GCALC_CASE " + label + " " + (ok ? "PASS" : "FAIL") + " " + res.mode + " " + (Date.now() - t0) + "ms " + JSON.stringify(res.timing || {}) + " " + JSON.stringify(got));
			return ok;
		} catch (e) {
			done("GCALC_CASE " + label + " FAIL error " + (e && (e.message || e)));
			return false;
		}
	}
	// Same scoring as tests/ocr/run.cjs: every visible subject found, nothing
	// extra, units and grade right.
	function score(item, rows) {
		var truth = {};
		item.truth.forEach(function (t) { truth[t[0].replace(/\s+/g, "")] = t; });
		var problems = [], found = {};
		rows.forEach(function (r) {
			var key = r.name.replace(/\s+/g, ""), t = truth[key];
			if (!t) { problems.push("extra " + r.name); return; }
			found[key] = true;
			if (r.units !== t[1]) problems.push(t[0] + " units " + r.units + "/" + t[1]);
			if ((r.grades || 0) !== t[2]) problems.push(t[0] + " grade " + (r.grades || "-") + "/" + (t[2] || "-"));
		});
		item.visible.forEach(function (code) { if (!found[code.replace(/\s+/g, "")]) problems.push("missed " + code); });
		return problems;
	}

	// Screenshots generated by tests/ocr/generate.cjs (bundled into debug builds on CI).
	async function runCorpus() {
		var list;
		try {
			list = await (await fetch("corpus/expected.json")).json();
		} catch (e) {
			done("GCALC_CORPUS none");
			return;
		}
		window.GCALC_FORCE_TESSERACT = false;
		window.GCALC_DEBUG = false;
		// Every other screenshot, and at most 12 minutes, so CI stays fast.
		list = list.filter(function (x, i) { return i % 2 === 0; });
		var pass = 0, times = 0, started = Date.now(), ran = 0, steps = {};
		for (var i = 0; i < list.length; i++) {
			if (Date.now() - started > 12 * 60 * 1000) break;
			ran++;
			var item = list[i], t0 = Date.now();
			try {
				var blob = await (await fetch("corpus/" + item.file)).blob();
				var res = await window.GCalcOCR.read(blob, function () {});
				var problems = score(item, res.rows);
				Object.keys(res.timing || {}).forEach(function (k) { (steps[k] = steps[k] || []).push(res.timing[k]); });
				if (res.mode !== "ai") problems.unshift("mode " + res.mode);
				if (problems.length) done("GCALC_CORPUS_FAIL " + item.file + ": " + problems.join("; "));
				else pass++;
			} catch (e) {
				done("GCALC_CORPUS_FAIL " + item.file + ": error " + (e && (e.message || e)));
			}
			times += Date.now() - t0;
		}
		done("GCALC_CORPUS ai " + pass + "/" + ran + " fully correct, avg " + Math.round(times / Math.max(1, ran)) + "ms (" + Object.keys(steps).map(function (k) {
			return k + " " + Math.round(steps[k].reduce(function (a, b) { return a + b; }, 0) / steps[k].length);
		}).join(", ") + ")");
	}

	(async function () {
		var ai = await run("ai", 1, false);
		var aiSmall = await run("ai-small", 0.5, false); // reported, not required
		var tess = await run("tesseract", 1, true);
		done("GCALC_SELFTEST " + (ai && tess ? "PASS" : "FAIL") + " ai=" + ai + " ai-small=" + aiSmall + " tesseract=" + tess);
		await runCorpus();
		done("GCALC_DONE");
	})();
})();
</script>
</body>
</html>
