plugins {
    id 'com.android.application'
}

// Optional release signing. Set these as environment variables (the GitHub
// workflow fills them from repository secrets). Without them the release build
// falls back to the debug key, which still installs fine on a phone.
def ksPath = System.getenv('GCALC_KEYSTORE_PATH')
def hasReleaseKey = ksPath != null && file(ksPath).exists()

android {
    namespace 'com.gcalc.gwa'
    compileSdk 35

    defaultConfig {
        applicationId 'com.gcalc.gwa'
        minSdk 24
        targetSdk 35
        versionCode Integer.parseInt(System.getenv('GCALC_VERSION_CODE') ?: '1')
        versionName System.getenv('GCALC_VERSION_NAME') ?: '1.0'
    }

    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile file(ksPath)
                storePassword System.getenv('GCALC_KEYSTORE_PASSWORD')
                keyAlias System.getenv('GCALC_KEY_ALIAS')
                keyPassword System.getenv('GCALC_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The calculator itself lives in /www at the repo root (shared with the web
    // version), and is bundled into the APK so the app works offline.
    sourceSets {
        main {
            assets.srcDirs = ['../../www']
        }
    }

    lint {
        abortOnError false
    }
}
