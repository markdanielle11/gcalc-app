<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
	<title>GCalc</title>
	<meta name="description" content="Compute your GWA quickly. Made for CLSU students." />
	<meta name="theme-color" content="#1E2B4D" />
	<meta name="color-scheme" content="dark light" />

	<!-- Installable app (Android "Install app", iPhone "Add to Home Screen") -->
	<link rel="manifest" href="manifest.webmanifest" />
	<meta name="mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-title" content="GCalc" />
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
	<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
	<link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
	<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />

	<link rel="preload" href="fonts/Outfit.ttf" as="font" type="font/ttf" crossorigin />
	<link rel="stylesheet" href="app.css" />

	<!-- Apply the saved theme before first paint so there is no flash. -->
	<script>
		(function () {
			var dark = true;
			try {
				var s = JSON.parse(localStorage.getItem("gcalc-state-v1"));
				if (s && typeof s.isDark === "boolean") dark = s.isDark;
				else if (window.matchMedia) dark = !window.matchMedia("(prefers-color-scheme: light)").matches;
			} catch (e) {}
			document.documentElement.className = dark ? "theme-dark" : "theme-light";
		})();
	</script>
</head>
<body>

	<div class="app">
		<header class="topbar">
			<h1 class="title">GWA Calculator</h1>
			<button type="button" class="icon-btn" id="theme-btn">
				<svg class="icon icon-sun" aria-hidden="true"><use href="#i-sun"></use></svg>
				<svg class="icon icon-moon" aria-hidden="true"><use href="#i-moon"></use></svg>
			</button>
		</header>

		<section class="hero" id="hero" aria-labelledby="hero-label">
			<p class="hero-label" id="hero-label">General Weighted Average</p>
			<div class="hero-row">
				<p class="gwa is-empty" id="gwa" aria-live="polite">0.00</p>
				<p class="standing" id="standing" hidden></p>
			</div>
			<dl class="stats">
				<div class="stat">
					<dt>Units</dt>
					<dd id="stat-units">0</dd>
				</div>
				<div class="stat">
					<dt>Subjects</dt>
					<dd id="stat-subjects">0</dd>
				</div>
			</dl>
		</section>

		<section class="subjects" aria-labelledby="subjects-title">
			<div class="subjects-head">
				<h2 class="subjects-title" id="subjects-title">Subjects</h2>
				<button type="button" class="text-btn" id="clear-btn">
					<svg class="icon" aria-hidden="true"><use href="#i-arrow-counter-clockwise"></use></svg>
					Clear all
				</button>
			</div>
			<ul class="subject-list" id="list"></ul>
			<p class="empty" id="empty">No subjects yet</p>
		</section>

		<footer class="footer">
			<a href="https://aaronjay30.github.io/aaronjay_portfolio/" target="_blank" rel="noopener">© Aaron Jay Gabato. Buy me a Coffee! ☕</a>
		</footer>
	</div>

	<!-- Compact GWA shown at the top once the big card scrolls away -->
	<div class="minibar" id="minibar" aria-hidden="true">
		<div class="minibar-inner">
			<span class="minibar-label">GWA</span>
			<span class="minibar-gwa" id="mini-gwa">0.00</span>
			<span class="minibar-standing" id="mini-standing" hidden></span>
		</div>
	</div>

	<div class="bottombar">
		<div class="bottombar-inner">
			<button type="button" class="btn btn-secondary" id="import-btn">
				<svg class="icon" aria-hidden="true"><use href="#i-scan"></use></svg>
				Import
			</button>
			<button type="button" class="btn btn-primary" id="add-btn">
				<svg class="icon" aria-hidden="true"><use href="#i-plus"></use></svg>
				Add subject
			</button>
		</div>
		<input type="file" id="import-input" accept="image/*" hidden />
	</div>

	<!-- Subject editor -->
	<dialog class="sheet" id="editor" aria-labelledby="editor-title">
		<div class="sheet-inner">
			<div class="grabber" aria-hidden="true"></div>
			<div class="sheet-head">
				<h2 class="sheet-title" id="editor-title">New subject</h2>
				<button type="button" class="icon-btn" id="editor-close" aria-label="Close">
					<svg class="icon" aria-hidden="true"><use href="#i-x"></use></svg>
				</button>
			</div>

			<div class="sheet-body">
				<div class="field-group">
					<label class="field-label" for="name-input">Subject name</label>
					<input class="text-input" id="name-input" type="text" maxlength="40" autocomplete="off" enterkeyhint="done" placeholder="e.g. IT 311" />
				</div>

				<div class="field-group">
					<p class="field-label" id="grade-label">Grade</p>
					<div class="choice-grid grade-grid" id="grade-grid" role="radiogroup" aria-labelledby="grade-label"></div>
				</div>

				<div class="field-group">
					<p class="field-label" id="units-label">Units</p>
					<div class="choice-grid units-grid" id="units-grid" role="radiogroup" aria-labelledby="units-label"></div>
				</div>
			</div>

			<div class="sheet-actions">
				<button type="button" class="btn btn-secondary" id="editor-secondary">Done</button>
				<button type="button" class="btn btn-primary" id="editor-primary">
					<span id="editor-primary-text">Next subject</span>
					<svg class="icon" id="editor-primary-icon" aria-hidden="true"><use href="#i-arrow-right"></use></svg>
				</button>
			</div>
		</div>
	</dialog>

	<!-- Import from a screenshot of your grades -->
	<dialog class="sheet" id="importer" aria-labelledby="import-title">
		<div class="sheet-inner">
			<div class="grabber" aria-hidden="true"></div>
			<div class="sheet-head">
				<h2 class="sheet-title" id="import-title">Reading screenshot</h2>
				<button type="button" class="icon-btn" id="import-close" aria-label="Close">
					<svg class="icon" aria-hidden="true"><use href="#i-x"></use></svg>
				</button>
			</div>

			<div class="sheet-body">
				<!-- Working -->
				<div class="import-progress" id="import-progress">
					<div class="import-preview-wrap">
						<img class="import-preview" id="import-preview" alt="" />
						<div class="scanline" aria-hidden="true"></div>
					</div>
					<div class="progress" role="progressbar" aria-labelledby="import-step" aria-valuemin="0" aria-valuemax="100" id="import-bar">
						<div class="progress-fill" id="import-fill"></div>
					</div>
					<p class="import-step" id="import-step">Opening image</p>
				</div>

				<!-- Results -->
				<ul class="import-list" id="import-list" hidden></ul>

				<!-- Nothing found / error -->
				<p class="import-message" id="import-message" hidden></p>
			</div>

			<div class="sheet-actions">
				<button type="button" class="btn btn-secondary" id="import-secondary">Cancel</button>
				<button type="button" class="btn btn-primary" id="import-primary" disabled>Add subjects</button>
			</div>
		</div>
	</dialog>

	<!-- Undo message -->
	<div class="toast" id="toast" role="status" aria-live="polite" hidden>
		<span class="toast-text" id="toast-text"></span>
		<button type="button" class="toast-btn" id="toast-undo">Undo</button>
	</div>

	<script src="ocr.js" defer></script>
	<script src="app.js"></script>
</body>
</html>
