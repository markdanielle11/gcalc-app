<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
	<title>GCalc</title>
	<meta name="description" content="Compute your GWA quickly. Made for CLSU students." />
	<meta name="theme-color" content="#1E2B4D" />
	<meta name="color-scheme" content="dark light" />

	<!-- Installable app (Android "Install app", iPhone "Add to Home Screen") -->
	<link rel="manifest" href="manifest.webmanifest" />
	<meta name="mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-title" content="GCalc" />
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
	<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
	<link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
	<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />

	<link rel="preload" href="fonts/Outfit.ttf" as="font" type="font/ttf" crossorigin />
	<link rel="stylesheet" href="app.css" />

	<!-- Apply the saved theme before first paint so there is no flash. -->
	<script>
		(function () {
			var dark = true;
			try {
				var s = JSON.parse(localStorage.getItem("gcalc-state-v1"));
				if (s && typeof s.isDark === "boolean") dark = s.isDark;
				else if (window.matchMedia) dark = !window.matchMedia("(prefers-color-scheme: light)").matches;
			} catch (e) {}
			document.documentElement.className = dark ? "theme-dark" : "theme-light";
		})();
	</script>
</head>
<body>
	<!-- Icons: Phosphor Icons (regular), MIT License, https://phosphoricons.com -->

="M216,48H176V40a24,24,0,0,0-24-24H104A24,24,0,0,0,80,40v8H40a8,8,0,0,0,0,16h8V208a16,16,0,0,0,16,16H192a16,16,0,0,0,16-16V64h8a8,8,0,0,0,0-16ZM96,40a8,8,0,0,1,8-8h48a8,8,0,0,1,8,8v8H96Zm96,168H64V64H192ZM112,104v64a8,8,0,0,1-16,0V104a8,8,0,0,1,16,0Zm48,0v64a8,8,0,0,1-16,0V104a8,8,0,0,1,16,0Z"/></symbol><symbol id="i-x" viewBox="0 0 256 256"><path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"/></symbol></svg>

	<div class="app">
		<header class="topbar">
			<h1 class="title">GWA Calculator</h1>
			<button type="button" class="icon-btn" id="theme-btn">
				<svg class="icon icon-sun" aria-hidden="true"><use href="#i-sun"></use></svg>
				<svg class="icon icon-moon" aria-hidden="true"><use href="#i-moon"></use></svg>
			</button>
		</header>

		<section class="summary" aria-labelledby="gwa-label">
			<div class="summary-card">
				<div class="summary-main">
					<p class="summary-label" id="gwa-label">Your GWA</p>
					<p class="gwa" id="gwa" aria-live="polite">0.00</p>
				</div>
				<div class="summary-side">
					<p class="standing" id="standing" hidden></p>
					<p class="meta" id="meta">0 units</p>
				</div>
				<p class="hint" id="hint"></p>
			</div>
		</section>

		<section class="subjects" aria-labelledby="subjects-title">
			<div class="subjects-head">
				<h2 class="subjects-title" id="subjects-title">Subjects</h2>
				<button type="button" class="text-btn" id="clear-btn">
					<svg class="icon" aria-hidden="true"><use href="#i-arrow-counter-clockwise"></use></svg>
					Clear all
				</button>
			</div>

			<ol class="subject-list" id="list"></ol>

			<button type="button" class="add-btn" id="add-btn">
				<svg class="icon" aria-hidden="true"><use href="#i-plus"></use></svg>
				Add subject
			</button>
		</section>

		<footer class="footer">
			<a href="https://aaronjay30.github.io/aaronjay_portfolio/" target="_blank" rel="noopener">© Aaron Jay Gabato. Buy me a Coffee! ☕</a>
		</footer>
	</div>

	<!-- Grade picker -->
	<dialog class="sheet" id="grade-sheet" aria-labelledby="sheet-title">
		<div class="sheet-head">
			<h2 class="sheet-title" id="sheet-title">Grade</h2>
			<button type="button" class="icon-btn" id="sheet-close" aria-label="Close">
				<svg class="icon" aria-hidden="true"><use href="#i-x"></use></svg>
			</button>
		</div>
		<div class="grade-grid" id="grade-grid" role="listbox" aria-labelledby="sheet-title"></div>
	</dialog>

	<!-- Undo message -->
	<div class="toast" id="toast" role="status" aria-live="polite" hidden>
		<span class="toast-text" id="toast-text"></span>
		<button type="button" class="toast-btn" id="toast-undo">Undo</button>
	</div>

	<script src="app.js"></script>
</body>
</html>
